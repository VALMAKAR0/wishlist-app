<!doctype html>
<html lang="de" data-theme="dark" data-fx="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0e17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Wunschliste</title>
    <script>
      // Theme vor dem ersten Paint setzen, damit nichts aufblitzt.
      try {
        var s = JSON.parse(localStorage.getItem('wl.ui') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.dataset.theme = dark ? 'dark' : 'light';
        if (s.fx) r.dataset.fx = s.fx;
        if (typeof s.hue === 'number') r.style.setProperty('--hue', s.hue);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
